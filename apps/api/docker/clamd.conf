DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketGroup app
LocalSocketMode 660
FixStaleSocket true
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
Foreground yes
LogTime yes
ConcurrentDatabaseReload no

# Uploads are capped at 100 MiB. Keep scanner limits above that and alert on
# anything it cannot fully inspect, including deeply nested or oversized archives.
StreamMaxLength 110M
MaxFileSize 110M
MaxScanSize 512M
MaxRecursion 20
MaxFiles 10000
MaxScanTime 120000
AlertExceedsMax yes
AlertEncrypted yes
AlertOLE2Macros yes

MaxThreads 4
MaxQueue 16
ReadTimeout 120
CommandReadTimeout 30
